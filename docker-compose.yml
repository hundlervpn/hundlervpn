version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hundler-app
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://hundlervpn.xyz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OXAPAY_API_KEY: ${OXAPAY_API_KEY}
      POSTGRESQL_HOST: ${POSTGRESQL_HOST}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT:-5432}
      POSTGRESQL_USER: ${POSTGRESQL_USER}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_DBNAME: ${POSTGRESQL_DBNAME}
      POSTGRESQL_SSL_MODE: ${POSTGRESQL_SSL_MODE:-disable}
      POSTGRESQL_SSL_CA_PATH: ${POSTGRESQL_SSL_CA_PATH:-}
      XRAY_VLESS_HOST: ${XRAY_VLESS_HOST:-}
      XRAY_VLESS_PORT: ${XRAY_VLESS_PORT:-443}
      XRAY_REALITY_PUBLIC_KEY: ${XRAY_REALITY_PUBLIC_KEY:-}
      XRAY_REALITY_SNI: ${XRAY_REALITY_SNI:-}
      XRAY_REALITY_SHORT_ID: ${XRAY_REALITY_SHORT_ID:-}
      XRAY_REALITY_FINGERPRINT: ${XRAY_REALITY_FINGERPRINT:-chrome}
      XRAY_VLESS_FLOW: ${XRAY_VLESS_FLOW:-xtls-rprx-vision}
      XRAY_VLESS_REMARK: ${XRAY_VLESS_REMARK:-HundlerVPN}
      XRAY_VLESS_COUNTRY: ${XRAY_VLESS_COUNTRY:-}
      XRAY_SYNC_TOKEN: ${XRAY_SYNC_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PLATEGA_MERCHANT_ID: ${PLATEGA_MERCHANT_ID:-}
      PLATEGA_SECRET_KEY: ${PLATEGA_SECRET_KEY:-}
      VPN_WEBHOOK_SECRET: ${VPN_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-hundlervpnbot}
    networks:
      - web

  # --- HundlerVPN Telegram launcher + broadcast bot -----------------------
  # Replaces the host systemd unit hundlervpn-bot.service (bot/main.py).
  # Uses the SAME token as the Next.js app (TELEGRAM_BOT_TOKEN) because this
  # is the single long-polling consumer for the main Mini App bot; the app
  # only sends via the Bot API, it does not poll.
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: hundler-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-hundlervpnbot}
      CHAT_BOT_USERNAME: ${CHAT_BOT_USERNAME:-hundlervpn_bot}
      APP_URL: ${APP_URL:-https://hundlervpn.xyz}
      BROADCASTS_ENABLED: ${BROADCASTS_ENABLED:-1}
      POSTGRESQL_HOST: ${POSTGRESQL_HOST}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT:-5432}
      POSTGRESQL_USER: ${POSTGRESQL_USER}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_DBNAME: ${POSTGRESQL_DBNAME}
      POSTGRESQL_SSLMODE: ${POSTGRESQL_SSLMODE:-require}
    networks:
      - web

  # --- HundlerVPN chat-only bot -------------------------------------------
  # Replaces the host systemd unit hundlervpn-bot-chat.service (bot-chat/).
  # MUST use a DIFFERENT Telegram token than `bot` (mapped from CHAT_BOT_TOKEN
  # in the root .env into the container's TELEGRAM_BOT_TOKEN var).
  bot-chat:
    build:
      context: ./bot-chat
      dockerfile: Dockerfile
    container_name: hundler-bot-chat
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_CHAT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${CHAT_BOT_USERNAME:-hundlervpn_bot}
      MAIN_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-hundlervpnbot}
      APP_URL: ${APP_URL:-https://hundlervpn.xyz}
      XRAY_SYNC_TOKEN: ${XRAY_SYNC_TOKEN:-}
      BOT_API_SECRET: ${BOT_API_SECRET:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      POSTGRESQL_HOST: ${POSTGRESQL_HOST}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT:-5432}
      POSTGRESQL_USER: ${POSTGRESQL_USER}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_DBNAME: ${POSTGRESQL_DBNAME}
      POSTGRESQL_SSLMODE: ${POSTGRESQL_SSLMODE:-require}
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: hundler-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - web

  certbot:
    image: certbot/certbot
    container_name: hundler-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - web

networks:
  web:
    driver: bridge
