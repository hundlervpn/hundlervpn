# Self-hosted single-VPS overlay for Hundler VPN.
# Adds a containerized Postgres (with volume + schema auto-init) and points
# the app at it. Use ALONGSIDE the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.selfhosted.yml up -d --build
#
# The base docker-compose.yml is left untouched (it keeps the DB external,
# for the Hostman managed-PG deployment path). This overlay is opt-in.
#
# On first start (empty pgdata volume) Postgres runs everything in
# /docker-entrypoint-initdb.d/ in alphabetical order: 01 = full schema,
# 02 = the Remnawave bridge columns (NOT included in schema.sql).
services:
  postgres:
    image: postgres:16-alpine
    container_name: hundler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DBNAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/2026-06-27-remnawave-bridge.sql:/docker-entrypoint-initdb.d/02-remnawave-bridge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER} -d ${POSTGRESQL_DBNAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - web

  app:
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
