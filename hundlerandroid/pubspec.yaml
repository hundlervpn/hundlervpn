name: hundler
description: "Hundler VPN — VLESS+Reality VPN client for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  # sing-box JSON кешируем на диск (FBE-шифрование + быстрый доступ)
  # вместо EncryptedSharedPreferences где большие значения тормозят.
  path_provider: ^2.1.4

  # Device info -> X-HWID header
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.1

  # UI
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.5
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1

  # Auth — OAuth через Custom Tabs (Google/Telegram). Ждёт redirect
  # на `hundler://auth/callback?token=...` и возвращает URL в Dart.
  flutter_web_auth_2: ^4.1.0
  # Перехват прочих deep links вне OAuth-флоу (приглашения и т.п.).
  app_links: ^6.3.2

  # Utils
  url_launcher: ^6.3.1
  intl: ^0.20.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Генератор launcher icon'ов для Android (mipmap-*, adaptive_icon).
  # Запускается командой `dart run flutter_launcher_icons` — читает секцию
  # `flutter_launcher_icons:` ниже + assets/images/tiger.png и пишет
  # все .png размеры в android/app/src/main/res/mipmap-*/.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Шрифты Manrope и Space Grotesk подгружаются через google_fonts на
  # лету (HTTP-кеш в первый запуск + offline после). Если позже захотим
  # bundling — положить .ttf в assets/fonts/ и заполнить fonts:.

# ── flutter_launcher_icons ─────────────────────────────────────────────
# Сгенерировать иконки: `dart run flutter_launcher_icons`
#
# Используем adaptive_icon (Android 8+): foreground = tiger на прозрачном
# фоне, background = чёрный (#020202, наш bg-primary). Для legacy-устройств
# (Android 7 и ниже) собираем classic ic_launcher из того же tiger.png.
#
# `min_sdk_android: 24` совпадает с defaultConfig.minSdk = 24 в
# build.gradle.kts. Adaptive-иконки сами рендерятся системой в круг /
# squircle / прямоугольник под лаунчер пользователя.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/tiger.png"
  min_sdk_android: 24
  adaptive_icon_background: "#020202"
  adaptive_icon_foreground: "assets/images/tiger.png"
  remove_alpha_ios: false

